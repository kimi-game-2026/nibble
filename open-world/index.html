<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nibble — Eat. Grow. Survive.</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
    background: radial-gradient(circle at 50% 30%, rgba(56, 102, 65, 0.35), rgba(7, 17, 24, 0.88));
    backdrop-filter: blur(7px); color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    user-select: none;
  }
  #overlay.hidden { display: none; }
  .menu-card {
    width: min(570px, 100%); padding: 42px 44px 32px; box-sizing: border-box;
    border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 28px;
    background: linear-gradient(145deg, rgba(24, 48, 44, 0.94), rgba(13, 25, 35, 0.96));
    box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45), inset 0 1px rgba(255, 255, 255, 0.12);
    text-align: center;
  }
  #menu-eyebrow {
    margin: 0 0 14px; color: #b7e4c7; font-size: 11px; font-weight: 800;
    letter-spacing: 0.24em;
  }
  #menu-title {
    margin: 0; color: #f4ffdf; font-size: clamp(54px, 10vw, 88px); line-height: 0.95;
    letter-spacing: -0.065em; font-weight: 900;
    text-shadow: 0 5px 0 #386641, 0 12px 34px rgba(0, 0, 0, 0.35);
  }
  #overlay.paused #menu-title { font-size: clamp(36px, 6vw, 58px); letter-spacing: -0.045em; }
  #menu-tagline { margin: 20px 0 0; color: #e7f4e4; font-size: 18px; line-height: 1.5; }
  .menu-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }
  .menu-actions button {
    min-height: 54px; padding: 0 24px; border: 0; border-radius: 15px;
    font: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
    transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
  }
  .menu-actions button:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .menu-actions button:active { transform: translateY(0); }
  .menu-actions button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #primary-action {
    color: #17351f; background: linear-gradient(135deg, #d8f3a3, #74c69d);
    box-shadow: 0 8px 24px rgba(116, 198, 157, 0.25);
  }
  #restart-action { color: #e7f4e4; background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(255, 255, 255, 0.16); }
  #restart-action[hidden] { display: none; }
  #menu-status { margin: 18px 0 0; color: #b7c9c2; font-size: 13px; }
  .menu-controls {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 20px;
    margin-top: 28px; padding-top: 22px; border-top: 1px solid rgba(255, 255, 255, 0.12);
    color: #b7c9c2; font-size: 12px;
  }
  .menu-controls span { color: #f4ffdf; font-weight: 800; }
  #hud {
    position: fixed; top: 5vh; left: 25vw; z-index: 5;
    pointer-events: none; user-select: none;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #hud .portrait {
    width: 7.5vw; height: 7.5vw; border-radius: 50%;
    border: 3px solid #2b2b2b; overflow: hidden;
    background: #dff1fa; position: relative; z-index: 2;
  }
  #hud .portrait canvas { width: 100%; height: 100%; display: block; }
  #hud .xp-bar {
    position: absolute; left: 7.5vw; top: 3.75vw;
    width: 40.5vw; height: 2.2vw;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.45);
    border: 3px solid #2b2b2b; border-radius: 1.1vw;
    overflow: hidden;
  }
  #hud .xp-fill {
    position: absolute; inset: 0; width: 0%;
    background: #6fbf5a; border-radius: 0.9vw;
    transition: width 0.25s ease-out;
  }
  #hud .xp-text {
    position: absolute; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1vw; font-weight: 700;
    text-shadow: 0 1px 3px #2b2b2b;
  }
  #hud .label {
    margin-top: 0.6vw; width: 7.5vw; text-align: center;
    font-size: 1.3vw; font-weight: 700; color: #ffffff;
    text-shadow:
      -1px -1px 0 #2b2b2b, 1px -1px 0 #2b2b2b,
      -1px 1px 0 #2b2b2b, 1px 1px 0 #2b2b2b,
      0 2px 4px rgba(0, 0, 0, 0.4);
  }
  #hud .invincibility {
    position: absolute; left: 9vw; top: 6.2vw; width: 39vw;
    text-align: center; color: #ffe66d; font-size: 1.2vw; font-weight: 700;
    text-shadow: 0 1px 3px #2b2b2b;
  }
  #hud .xp-bar.level-up { animation: hud-levelup 0.5s ease-out; }
  @keyframes hud-levelup {
    0% { box-shadow: 0 0 0 rgba(110, 191, 90, 0.9); }
    100% { box-shadow: 0 0 24px rgba(110, 191, 90, 0); }
  }
  @media (max-width: 600px) {
    .menu-card { padding: 32px 24px 26px; }
    #menu-tagline { font-size: 16px; }
    #hud { left: 15vw; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <section class="menu-card">
    <p id="menu-eyebrow">A TINY SURVIVAL ADVENTURE</p>
    <h1 id="menu-title">NIBBLE</h1>
    <p id="menu-tagline">Eat small. Grow mighty. Rule the wild.</p>
    <div class="menu-actions">
      <button id="primary-action" type="button">Start Nibbling</button>
      <button id="restart-action" type="button" hidden>Restart Run</button>
    </div>
    <p id="menu-status">The wild is hungry. So are you.</p>
    <div class="menu-controls">
      <div><span>WASD</span> Move</div>
      <div><span>Mouse</span> Look</div>
      <div><span>Esc</span> Pause</div>
      <div><span>F3</span> Enemy radii</div>
    </div>
  </section>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
